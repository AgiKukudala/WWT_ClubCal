name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clubcal_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clubcal_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create databases
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE clubcal_test"
          psql -h localhost -U postgres -c "CREATE DATABASE clubcal_e2e"
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests (real PostgreSQL)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the Compose stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep -q ClubCal
          docker compose run --rm migrate node dist/seed.js
      - if: always()
        run: docker compose logs --no-color | tail -200
